services:
    api:
        image: ghcr.io/ctrlaltelite-devs/api.queuemcwd.ph:staging
        ports:
            - "5001:5001"
        env_file:
            - .env
        environment:
            - NODE_ENV=development
        networks:
            - mcwd-network
networks:
    mcwd-network:
        external: true
