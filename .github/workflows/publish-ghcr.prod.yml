name: Build, Publish, and Deploy Docker Image (Production)

on:
    push:
        branches:
            - master

env:
    REGISTRY: ghcr.io
    ORG: ctrlaltelite-devs
    IMAGE: api.queuemcwd.ph
    TAG: latest

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            # Deployment Started
            - name: Deployment to Production notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
                  DISCORD_USERNAME: "Bini Mikha"
                  DISCORD_AVATAR: "https://scontent.fceb9-1.fna.fbcdn.net/v/t39.30808-6/449400457_122112877598351565_6658162309362256856_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeHFs3s2gsjqpZjILGLL0zMKeB7THXgmBH54HtMdeCYEfnuIf_iLBBJoTsroPdLNxOkXg7DEG3803Fv8lEaxm-nw&_nc_ohc=flcqkE7XAVwQ7kNvwHrduBu&_nc_oc=Adk1R1UOsRBobq6ELs9TKUhy1_8lGxgKxlayoDi3XgNl2LaUylXLyk8iF9RFS3ig5C8&_nc_zt=23&_nc_ht=scontent.fceb9-1.fna&_nc_gid=0g0qlUGzMvB4ylKrat5O0A&oh=00_AfinOZ_AwxXMKGuMTtmOge-ppy3V_LPzEzUXrEszuThZJw&oe=69239FF9"
              uses: Ilshidur/action-discord@0.4.0
              with:
                  args: "Bawat araw, mas sumasaya, magmula nang nakita ka 🌸, We have a production deployment today by ${{github.actor}}, good luck! 💓"

            # 1️⃣ Checkout repository
            - name: Checkout code
              uses: actions/checkout@v4

            # 2️⃣ Set up Docker Buildx
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 3️⃣ Log in to GHCR
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.GH_USERNAME }}
                  password: ${{ secrets.GH_PAT }}

            # 4️⃣ Build Docker image
            - name: Build Docker image
              run: |
                  docker build \
                    -t $REGISTRY/$ORG/$IMAGE:${TAG} \
                    -t $REGISTRY/$ORG/$IMAGE:${GITHUB_SHA} \
                    .

            # 5️⃣ Push Docker image
            - name: Push Docker image
              run: |
                  docker push $REGISTRY/$ORG/$IMAGE:${TAG}
                  docker push $REGISTRY/$ORG/$IMAGE:${GITHUB_SHA}

            # 6️⃣ Deploy to VPS via SSH
            - name: Deploy to Staging VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_PROD_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      DEPLOY_DIR=~/deployments
                      mkdir -p "$DEPLOY_DIR"
                      cd "$DEPLOY_DIR"

                      if [ ! -d api.queuemcwd.ph ]; then
                          git clone git@github.com:CtrlAltElite-Devs/api.queuemcwd.ph.git
                      else
                          cd api.queuemcwd.ph
                          git fetch origin
                          git pull origin
                          cd ..
                      fi

                      cd api.queuemcwd.ph

                      SHA_TAG=$(git rev-parse HEAD)

                      # 🚀 Stop old containers before starting new ones
                      docker compose -p mwcd-prod -f docker-compose.prod.yml down

                      # Build the image with no cache
                      docker compose -p mwcd-prod -f docker-compose.prod.yml build --no-cache

                      # 🆕 Start new containers
                      docker compose -p mwcd-prod -f docker-compose.prod.yml up -d

            # if deployment failed
            - name: Failed Deployment to production notification
              if: failure()
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
                  DISCORD_USERNAME: "Bini Mikha"
                  DISCORD_AVATAR: "https://scontent.fceb9-1.fna.fbcdn.net/v/t39.30808-6/449400457_122112877598351565_6658162309362256856_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeHFs3s2gsjqpZjILGLL0zMKeB7THXgmBH54HtMdeCYEfnuIf_iLBBJoTsroPdLNxOkXg7DEG3803Fv8lEaxm-nw&_nc_ohc=flcqkE7XAVwQ7kNvwHrduBu&_nc_oc=Adk1R1UOsRBobq6ELs9TKUhy1_8lGxgKxlayoDi3XgNl2LaUylXLyk8iF9RFS3ig5C8&_nc_zt=23&_nc_ht=scontent.fceb9-1.fna&_nc_gid=0g0qlUGzMvB4ylKrat5O0A&oh=00_AfinOZ_AwxXMKGuMTtmOge-ppy3V_LPzEzUXrEszuThZJw&oe=69239FF9"
              uses: Ilshidur/action-discord@0.4.0
              with:
                  args: "shucks! ${{github.actor}} something went wrong with the deployment. It's okay let's try again."

            # if deployment succeeded
            - name: Successful Deployment to Production
              if: success()
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
                  DISCORD_USERNAME: "Bini Mikha"
                  DISCORD_AVATAR: "https://scontent.fceb9-1.fna.fbcdn.net/v/t39.30808-6/449400457_122112877598351565_6658162309362256856_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeHFs3s2gsjqpZjILGLL0zMKeB7THXgmBH54HtMdeCYEfnuIf_iLBBJoTsroPdLNxOkXg7DEG3803Fv8lEaxm-nw&_nc_ohc=flcqkE7XAVwQ7kNvwHrduBu&_nc_oc=Adk1R1UOsRBobq6ELs9TKUhy1_8lGxgKxlayoDi3XgNl2LaUylXLyk8iF9RFS3ig5C8&_nc_zt=23&_nc_ht=scontent.fceb9-1.fna&_nc_gid=0g0qlUGzMvB4ylKrat5O0A&oh=00_AfinOZ_AwxXMKGuMTtmOge-ppy3V_LPzEzUXrEszuThZJw&oe=69239FF9"
                  DISCORD_EMBEDS: >
                      [
                         {
                         "title": "✅ Deployment Successful!",
                         "description": "The production deployment completed successfully. 🎉🎊",
                         "color": 3066993,
                         "fields": [
                             {
                                "name": "Branch",
                                "value": "${{ github.ref }}",
                                "inline": true
                             },
                             {
                                "name": "Commit",
                                "value": "${{ github.sha }}"
                             }
                             {
                                "name": "Deployed by",
                                "value": "${{ github.actor }}",
                                "inline": true  
                            }
                         ],
                         "timestamp": "${{ github.event.head_commit.timestamp }}"
                         }
                      ]
              uses: Ilshidur/action-discord@0.4.0
              with:
                  args: "YAY, SUCCESS! 🎉🎊 deployment successful! 👏 Let's celebrate, team! 🥳."
