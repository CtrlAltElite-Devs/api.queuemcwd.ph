name: Build, Publish, and Deploy Docker Image (Staging)

on:
    push:
        branches:
            - staging

env:
    REGISTRY: ghcr.io
    ORG: ctrlaltelite-devs
    IMAGE: api.queuemcwd.ph
    TAG: staging

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            # Deployment Started
            - name: Deployment to Staging notification
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
                  DISCORD_USERNAME: "Lebron James"
                  DISCORD_AVATAR: "https://cdn.basketballnews.com/images/images/players/headshots/e23a8ab1-a00b-424d-a8f5-b9bb08088e0a_320w.png"
              uses: Ilshidur/action-discord@0.4.0
              with:
                  args: "Yo what's up! It's ya boi Lebron James 🏀, si ${{github.actor}} kay nag deploy diay to STAGING. Tabangan natog ampo mga dawg 🙏"

            # 1️⃣ Checkout repository
            - name: Checkout code
              uses: actions/checkout@v4

            # 2️⃣ Set up Docker Buildx
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 3️⃣ Log in to GHCR
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.GH_USERNAME }}
                  password: ${{ secrets.GH_PAT }}

            # 4️⃣ Build Docker image
            - name: Build Docker image
              run: |
                  docker build \
                    -t $REGISTRY/$ORG/$IMAGE:${TAG} \
                    -t $REGISTRY/$ORG/$IMAGE:${GITHUB_SHA} \
                    .

            # 5️⃣ Push Docker image
            - name: Push Docker image
              run: |
                  docker push $REGISTRY/$ORG/$IMAGE:${TAG}
                  docker push $REGISTRY/$ORG/$IMAGE:${GITHUB_SHA}

            # 6️⃣ Deploy to VPS via SSH
            - name: Deploy to Staging VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      DEPLOY_DIR=~/deployments/mcwd/staging
                      mkdir -p "$DEPLOY_DIR"
                      cd "$DEPLOY_DIR"

                      if [ ! -d api.queuemcwd.ph ]; then
                          git clone --branch staging git@github.com:CtrlAltElite-Devs/api.queuemcwd.ph.git
                      else
                          cd api.queuemcwd.ph
                          git fetch origin
                          git checkout staging
                          git pull origin staging
                          cd ..
                      fi

                      cd api.queuemcwd.ph

                      SHA_TAG=$(git rev-parse HEAD)

                      # 🚀 Stop old containers before starting new ones
                      docker compose -p mcwd-staging -f docker-compose.staging.yml down

                      # Build the image with no cache
                      docker compose -p mcwd-staging -f docker-compose.staging.yml build --no-cache

                      # 🆕 Start new containers
                      docker compose -p mcwd-staging -f docker-compose.staging.yml up -d

            # if deployment failed
            - name: Failed Deployment to staging notification
              if: failure()
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
                  DISCORD_USERNAME: "Lebron James"
                  DISCORD_AVATAR: "https://cdn.basketballnews.com/images/images/players/headshots/e23a8ab1-a00b-424d-a8f5-b9bb08088e0a_320w.png"
              uses: Ilshidur/action-discord@0.4.0
              with:
                  args: "Yo guys! ang deployment ni ${{github.actor}} naguba BWAHAHAHAHA."

            # if deployment succeeded
            - name: Successful Deployment to staging
              if: success()
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENT_WEBHOOK }}
                  DISCORD_USERNAME: "Lebron James"
                  DISCORD_AVATAR: "https://cdn.basketballnews.com/images/images/players/headshots/e23a8ab1-a00b-424d-a8f5-b9bb08088e0a_320w.png"
              uses: Ilshidur/action-discord@0.4.0
              with:
                  args: "Let's gooo!! Deployment to Staging successful ✅🚀, nice ka dawg ${{github.actor}}."
