name: Build, Publish, and Deploy Docker Image

on:
    push:
        branches:
            - staging

env:
    REGISTRY: ghcr.io
    ORG: ctrlaltelite-devs
    IMAGE: api.queuemcwd.ph

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            # 1️⃣ Checkout repository
            - name: Checkout code
              uses: actions/checkout@v4

            # 2️⃣ Set up Docker Buildx
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 3️⃣ Log in to GHCR
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.GH_USERNAME }}
                  password: ${{ secrets.GH_PAT }}

            # 4️⃣ Determine image tag
            - name: Set image tags
              id: vars
              run: |
                  if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
                    echo "TAG=staging" >> $GITHUB_ENV
                  elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
                    echo "TAG=latest" >> $GITHUB_ENV
                  else
                    echo "TAG=dev" >> $GITHUB_ENV
                  fi
                  echo "SHA_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

            # 5️⃣ Build Docker image
            - name: Build Docker image
              run: |
                  docker build \
                    -t $REGISTRY/$ORG/$IMAGE:${TAG} \
                    -t $REGISTRY/$ORG/$IMAGE:${SHA_TAG} \
                    .

            # 6️⃣ Push Docker image
            - name: Push Docker image
              run: |
                  docker push $REGISTRY/$ORG/$IMAGE:${TAG}
                  docker push $REGISTRY/$ORG/$IMAGE:${SHA_TAG}

            # 7️⃣ Deploy to VPS via SSH
            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      DEPLOY_BASE=~/deployments/mcwd
                      declare -A ENVS
                      ENVS=( ["staging"]="staging" ["prod"]="master" )

                      for ENV in "${!ENVS[@]}"; do
                          BRANCH=${ENVS[$ENV]}
                          ENV_DIR="$DEPLOY_BASE/$ENV"
                          mkdir -p "$ENV_DIR"
                          cd "$ENV_DIR"

                          if [ ! -d api.queuemcwd.ph ]; then
                              git clone --branch "$BRANCH" git@github.com:CtrlAltElite-Devs/api.queuemcwd.ph.git
                          else
                              cd api.queuemcwd.ph
                              git fetch origin
                              git checkout "$BRANCH"
                              git pull origin "$BRANCH"
                              cd ..
                          fi

                          cd api.queuemcwd.ph

                          TAG="$BRANCH"
                          SHA_TAG=$(git rev-parse HEAD)

                          docker pull ghcr.io/ctrlaltelite-devs/api.queuemcwd.ph:${TAG}
                          docker pull ghcr.io/ctrlaltelite-devs/api.queuemcwd.ph:${SHA_TAG}

                          if [[ "$BRANCH" == "master" ]]; then
                              COMPOSE_FILE="docker-compose.prod.yml"
                          else
                              COMPOSE_FILE="docker-compose.staging.yml"
                          fi

                          echo "Deploying $ENV using $COMPOSE_FILE"
                          docker compose -f "$COMPOSE_FILE" up -d

                          cd "$DEPLOY_BASE"
