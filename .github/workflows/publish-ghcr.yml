name: Build and Publish Docker Image to GHCR

on:
    push:
        branches:
            - staging
            - master

env:
    REGISTRY: ghcr.io
    ORG: ctrlaltelite-devs # GitHub organization
    IMAGE: api.queuemcwd.ph # Image name

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout repository
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Set up Docker Buildx
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 3. Log in to GHCR
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.GH_USERNAME }}
                  password: ${{ secrets.GH_PAT }}

            # 4. Determine tag based on branch
            - name: Set image tags
              id: vars
              run: |
                  if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
                    echo "TAG=staging" >> $GITHUB_ENV
                  elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
                    echo "TAG=latest" >> $GITHUB_ENV
                  else
                    echo "TAG=dev" >> $GITHUB_ENV
                  fi
                  echo "SHA_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

            # 5. Build Docker image
            - name: Build Docker image
              run: |
                  docker build \
                    -t $REGISTRY/$ORG/$IMAGE:${TAG} \
                    -t $REGISTRY/$ORG/$IMAGE:${SHA_TAG} \
                    .

            # 6. Push Docker image to GHCR
            - name: Push Docker image
              run: |
                  docker push $REGISTRY/$ORG/$IMAGE:${TAG}
                  docker push $REGISTRY/$ORG/$IMAGE:${SHA_TAG}
