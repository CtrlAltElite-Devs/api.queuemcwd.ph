name: PR Tests

on:
    push:
        branches:
            - main
            - staging
    pull_request:
        branches:
            - main
            - staging
            - "**"

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            # Checkout
            - name: Checkout code
              uses: actions/checkout@v3

            # Setup Node.js with npm cache
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 24
                  cache: "npm"

            # Restore dist cache (optional if you want to reuse previous builds)
            - name: Restore dist cache
              uses: actions/cache@v3
              with:
                  path: dist
                  key: dist-${{ github.sha }}

            # Install dependencies
            - name: Install dependencies
              run: npm ci

            # Run tests
            - name: Run tests
              run: npm run test

            # Save dist cache after build
            - name: Save dist cache
              uses: actions/cache@v3
              with:
                  path: dist
                  key: dist-${{ github.sha }}
